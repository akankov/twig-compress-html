name: Feature request
description: Suggest a filter, tag, bundle, configuration, or documentation improvement.
title: "Feature: "
body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting an improvement. Please describe the use case and expected output clearly.

  - type: checkboxes
    id: preflight
    attributes:
      label: Pre-flight
      options:
        - label: I have searched existing issues.
          required: true
        - label: This belongs in the Twig extension layer (not in `akankov/html-min` itself).
          required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What limitation or use case should this solve?
    validations:
      required: true

  - type: textarea
    id: proposed-solution
    attributes:
      label: Proposed solution
      description: Describe the filter, tag, bundle config key, API, or documentation change you want.
    validations:
      required: true

  - type: textarea
    id: example
    attributes:
      label: Example template and output
      description: Include the Twig template before and the expected rendered output when applicable.
      render: twig

  - type: dropdown
    id: compatibility
    attributes:
      label: Could this change existing rendered output of the filter or tag?
      options:
        - "No"
        - "Yes"
        - "Not sure"
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Mention workarounds or caller-side solutions if any.

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Add links, prior art, or upstream discussion if relevant.
