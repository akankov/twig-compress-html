name: Bug report
description: Report incorrect filter or tag output, bundle wiring failure, or runtime error.
title: "Bug: "
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. Please include the smallest Twig template that reproduces the problem.

  - type: checkboxes
    id: preflight
    attributes:
      label: Pre-flight
      options:
        - label: I have searched existing issues.
          required: true
        - label: This is not a security vulnerability. I will use SECURITY.md for security reports.
          required: true

  - type: input
    id: version
    attributes:
      label: Package version
      description: Run `composer show akankov/twig-compress-html` or provide the commit SHA.
      placeholder: "1.0.0 or abc1234"
    validations:
      required: true

  - type: input
    id: php-version
    attributes:
      label: PHP version
      placeholder: "8.3.12"
    validations:
      required: true

  - type: input
    id: twig-version
    attributes:
      label: Twig version
      description: Run `composer show twig/twig`.
      placeholder: "3.10.0"
    validations:
      required: true

  - type: input
    id: symfony-version
    attributes:
      label: Symfony version
      description: Only fill in if you use the bundled AkankovTwigCompressHtmlBundle. Run `composer show symfony/framework-bundle`.
      placeholder: "7.1.0 or N/A"

  - type: textarea
    id: bundle-config
    attributes:
      label: Bundle configuration
      description: Paste your `akankov_twig_compress_html` config (YAML or PHP), or write "defaults".
      placeholder: "defaults"
      render: yaml

  - type: textarea
    id: input-template
    attributes:
      label: Input Twig template
      description: Smallest template that reproduces the problem.
      render: twig
    validations:
      required: true

  - type: textarea
    id: actual-output
    attributes:
      label: Actual rendered output
      render: html
    validations:
      required: true

  - type: textarea
    id: expected-output
    attributes:
      label: Expected rendered output
      render: html
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Add stack traces, container compilation errors, or links if relevant.
