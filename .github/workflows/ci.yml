name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  tests:
    name: PHP ${{ matrix.php }} tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ["8.3", "8.4", "8.5"]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6.0.3

      - name: Setup PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          extensions: dom, libxml, mbstring
          tools: composer:v2

      - name: Cache Composer dependencies
        uses: actions/cache@v5.0.5
        with:
          path: ~/.cache/composer
          key: composer-${{ matrix.php }}-${{ hashFiles('composer.json') }}
          restore-keys: composer-${{ matrix.php }}-

      - name: Install dependencies
        run: composer update --prefer-dist --no-interaction --no-progress

      - name: Run PHPUnit
        run: vendor/bin/phpunit

  coverage:
    name: Line coverage
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6.0.3

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          coverage: pcov
          extensions: dom, libxml, mbstring
          tools: composer:v2

      - name: Cache Composer dependencies
        uses: actions/cache@v5.0.5
        with:
          path: ~/.cache/composer
          key: composer-coverage-${{ hashFiles('composer.json') }}
          restore-keys: composer-coverage-

      - name: Install dependencies
        run: composer update --prefer-dist --no-interaction --no-progress

      - name: Run PHPUnit with coverage and enforce the floor
        run: make coverage

      - name: Run mutation testing and enforce the MSI floor
        run: make infection

  static-analysis:
    name: PHPStan (level max)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6.0.3

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          coverage: none
          extensions: dom, libxml, mbstring
          tools: composer:v2

      - name: Cache Composer dependencies
        uses: actions/cache@v5.0.5
        with:
          path: ~/.cache/composer
          key: composer-8.4-${{ hashFiles('composer.json') }}
          restore-keys: composer-8.4-

      - name: Install dependencies
        run: composer update --prefer-dist --no-interaction --no-progress

      - name: Run PHPStan
        run: vendor/bin/phpstan analyse --no-progress --memory-limit=512M

  phan:
    name: Phan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6.0.3

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          coverage: none
          extensions: dom, libxml, mbstring, ast
          tools: composer:v2

      - name: Cache Composer dependencies
        uses: actions/cache@v5.0.5
        with:
          path: ~/.cache/composer
          key: composer-phan-${{ hashFiles('composer.json') }}
          restore-keys: composer-phan-

      - name: Install dependencies
        run: composer update --prefer-dist --no-interaction --no-progress

      - name: Run Phan
        run: vendor/bin/phan --no-progress-bar

  rector-check:
    name: Rector dry-run
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6.0.3

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          coverage: none
          extensions: dom, libxml, mbstring
          tools: composer:v2

      - name: Cache Composer dependencies
        uses: actions/cache@v5.0.5
        with:
          path: ~/.cache/composer
          key: composer-8.4-${{ hashFiles('composer.json') }}
          restore-keys: composer-8.4-

      - name: Install dependencies
        run: composer update --prefer-dist --no-interaction --no-progress

      - name: Run Rector (dry-run)
        run: vendor/bin/rector process --dry-run

  code-style:
    name: PHP-CS-Fixer
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6.0.3

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          coverage: none
          extensions: dom, libxml, mbstring
          tools: composer:v2

      - name: Cache Composer dependencies
        uses: actions/cache@v5.0.5
        with:
          path: ~/.cache/composer
          key: composer-8.4-${{ hashFiles('composer.json') }}
          restore-keys: composer-8.4-

      - name: Install dependencies
        run: composer update --prefer-dist --no-interaction --no-progress

      - name: Check code style
        run: vendor/bin/php-cs-fixer fix --dry-run --diff

  security-audit:
    name: Security audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6.0.3

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          coverage: none
          extensions: dom, libxml, mbstring
          tools: composer:v2

      - name: Install dependencies
        run: composer update --prefer-dist --no-interaction --no-progress

      # Non-blocking: reports known advisories on every run. It does not fail the
      # build — composer.lock is not committed (deps resolve fresh each run), and
      # transitive/upstream advisories the package cannot directly fix should not
      # wedge unrelated PRs. Dependabot drives the actual dependency bumps.
      - name: composer audit
        run: composer audit --no-interaction
        continue-on-error: true
